<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartik's eMart | Kartik Bind </title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <h2><i class="fas fa-graduation-cap"></i> Kartik's eMart</h2>
    </div>
    
    
</header>

<div class="cart">
    <h3><i class="fas fa-shopping-cart"></i> Cart Details</h3>
    <p>Total Items: <span id="itemCount">0</span></p>
    <p>Total Price: ₹<span id="totalPrice">0</span></p>
    </div>

<div class="products-grid">


    <div class="card">
        <img src="images/image.png" alt="Smart LED TV" loading="lazy">
        <h3>Smart LED TV</h3>
        <p>₹15999</p>
        <button onclick="addToCart(15999, 'Smart LED TV', 1)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>
  
    <div class="card">
        <img src="images/product_2.jpg" alt="Fitness Smart Watch" loading="lazy">
        <h3>Fitness Smart Watch</h3>
        <p>₹2400</p>
        <button onclick="addToCart(2400, 'Fitness Smart Watch', 2)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>
    

    <div class="card">
        <img src="images/product_3.jpg" alt="Premium Pen Set" loading="lazy">
        <h3>Premium Book Set</h3>
        <p>₹399</p>
        <button onclick="addToCart(399, 'Premium Pen Set', 3)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>
    

    <div class="card">
        <img src="images/product_4.jpg" alt="Running Shoes" loading="lazy">
        <h3>Running Shoes</h3>
        <p>₹1200</p>
        <button onclick="addToCart(1200, 'Running Shoes', 4)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="images/product_5.jpg" alt="Ergonomic Chair" loading="lazy">
        <h3>Ergonomic Chair</h3>
        <p>₹5000</p>
        <button onclick="addToCart(5000, 'Ergonomic Chair', 5)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>

    <div class="card">
        <img src="images/product_6.jpg" alt="Mechanical Keyboard" loading="lazy">
        <h3>Mechanical Keyboard</h3>
        <p>₹1800</p>
        <button onclick="addToCart(1800, 'Mechanical Keyboard', 6)">
            <i class="fas fa-cart-plus"></i> Add to Cart
        </button>
    </div>
    
    
    
</div>


<script src="script.js"></script>


</body>
</html>
